[project]
name = "ofdm-mimo"
version = "0.1.0"
description = "Python conversions of MATLAB examples from MIMO-OFDM Wireless Communications with MATLAB."
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "scipy>=1.11",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ofdm_mimo"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
